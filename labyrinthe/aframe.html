

<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Labyrinthe</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>

  <body>

    <a-scene>

     
      <!-- TEXTURES                           -->
    

      <a-assets>

        <!-- Texture rouge / mur -->
        <img id="texture-mur" src="texture_murs.jpg">

        <!-- Texture bleue -->
        <img id="texture-bleu" src="texture_murs2.avif">

        <!-- Texture du sol -->
        <img id="texture-sol" src="texture_sols.jpeg">

        <!-- Texture du plafond -->
        <img id="texture-plafond" src="texture_plafond.avif">

      </a-assets>


     
      <!-- MURS EXTÉRIEURS                   -->
      

      <a-box
        position="-2 1 -2"
        scale="0.1 2 4"
        src="#texture-mur">
      </a-box>

      <a-box
        position="2 1 -2"
        scale="0.1 2 4"
        src="#texture-mur">
      </a-box>


     
      <!-- MUR DU FOND                       -->
     

      <a-box
        position="-1.5 1 -4"
        scale="1 2 0.1"
        src="#texture-mur">
      </a-box>

      <a-box
        position="0.5 1 -4"
        scale="2 2 0.1"
        src="#texture-mur">
      </a-box>


      
      <!-- MUR ARRIÈRE / ENTRÉE              -->
     

      <a-box
        position="-1 1 0"
        scale="2 2 0.1"
        src="#texture-mur">
      </a-box>

      <a-box
        position="1.5 1 0"
        scale="1 2 0.1"
        src="#texture-mur">
      </a-box>


      
      <!-- BLOCS BLEUS                       -->
   

      <a-box
        position="-1.5 1 -3"
        scale="1 2 0.1"
        src="#texture-bleu">
      </a-box>

      <a-box
        position="0 1 -3"
        scale="1 2 0.1"
        src="#texture-bleu">
      </a-box>

      <a-box
        position="-0.5 1 -2"
        scale="1 2 0.1"
        src="#texture-bleu">
      </a-box>

      <a-box
        position="1 1 -2"
        scale="1 2 0.1"
        src="#texture-bleu">
      </a-box>

      <a-box
        position="-1.5 1 -1"
        scale="1 2 0.1"
        src="#texture-bleu">
      </a-box>

      <a-box
        position="0.5 1 -1"
        scale="1 2 0.1"
        src="#texture-bleu">
      </a-box>


      
      <!-- BARRES BLEUES                     -->
     

      <a-box
        position="-1 1 -3.5"
        scale="0.1 2 1"
        src="#texture-bleu">
      </a-box>

      <a-box
        position="0 1 -2.5"
        scale="0.1 2 1"
        src="#texture-bleu">
      </a-box>

      <a-box
        position="1 1 -3.5"
        scale="0.1 2 1"
        src="#texture-bleu">
      </a-box>

      <a-box
        position="-1 1 -1.5"
        scale="0.1 2 1"
        src="#texture-bleu">
      </a-box>

      <a-box
        position="1 1 -1.5"
        scale="0.1 2 1"
        src="#texture-bleu">
      </a-box>


    
      <!-- SOL                                -->
     

      <a-plane
        position="0 0 -2"
        rotation="-90 0 0"
        width="4"
        height="4"
        src="#texture-sol">
      </a-plane>


     
      <!-- CIEL                               -->
      

      <a-sky color="#141010"></a-sky>


    </a-scene>

  </body>
</html>
```
